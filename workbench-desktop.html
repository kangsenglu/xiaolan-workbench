/* ---------- 音乐：节拍器 ---------- */
const METRONOME_TONES = [
  { key:"electronic", label:"电子", freq:880 },
  { key:"woodfish",   label:"木鱼", freq:600 },
  { key:"drumstick",  label:"鼓棒", freq:1200 },
];
let metronomeState = { bpm:90, running:false, tone:"electronic", iv:null, audioCtx:null, beatCount:0 };

function renderMetronome(){
  const s = metronomeState;
  const tones = METRONOME_TONES.map(t=>`<div class="opt ${t.key===s.tone?'on':''}" data-v="${t.key}">${t.label}</div>`).join("");
  return `<div class="metronome">
    <div class="mtr-head">${icon("activity",15)} 节拍器</div>
    <div class="mtr-body">
      <div class="bpm-display">${s.bpm}</div>
      <div class="bpm-label">BPM</div>
      <div class="bpm-ctrl">
        <button class="bpm-btn" data-d="-10">-10</button>
        <button class="bpm-btn" data-d="-1">-1</button>
        <button class="bpm-btn" data-d="1">+1</button>
        <button class="bpm-btn" data-d="10">+10</button>
      </div>
      <div class="mtr-tone">
        <span class="mtr-tone-label">音色</span>
        <div class="seg" id="mtrTone">${tones}</div>
      </div>
      <button class="mtr-toggle ${s.running?'running':''}" id="mtrToggle">${s.running?'停止':'开始'}</button>
    </div>
  </div>`;
}

function playMetronomeBeep(){
  const ctx = metronomeState.audioCtx;
  if(!ctx) return;
  const tone = METRONOME_TONES.find(t=>t.key===metronomeState.tone) || METRONOME_TONES[0];
  const isDown = (metronomeState.beatCount % 4 === 0);
  const freq = isDown ? tone.freq : Math.round(tone.freq * 0.75);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.value = freq;
  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.3, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.07);
  metronomeState.beatCount++;
}

function startMetronome(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC){ showToast("当前浏览器不支持音频"); return; }
  if(!metronomeState.audioCtx) metronomeState.audioCtx = new AC();
  if(metronomeState.audioCtx.state === "suspended") metronomeState.audioCtx.resume();
  metronomeState.running = true;
  metronomeState.beatCount = 0;
  playMetronomeBeep();
  const intervalMs = 60000 / metronomeState.bpm;
  metronomeState.iv = setInterval(()=>{ playMetronomeBeep(); }, intervalMs);
  render();
}

function stopMetronome(){
  metronomeState.running = false;
  if(metronomeState.iv){ clearInterval(metronomeState.iv); metronomeState.iv = null; }
  render();
}

function restartMetronome(){
  if(metronomeState.iv){ clearInterval(metronomeState.iv); metronomeState.iv = null; }
  metronomeState.beatCount = 0;
  playMetronomeBeep();
  const intervalMs = 60000 / metronomeState.bpm;
  metronomeState.iv = setInterval(()=>{ playMetronomeBeep(); }, intervalMs);
}

function wireMetronome(){
  const screen = $("#screen"); if(!screen) return;
  screen.querySelectorAll(".bpm-btn").forEach(b=>{
    b.onclick = ()=>{
      const d = +b.dataset.d;
      metronomeState.bpm = Math.max(40, Math.min(200, metronomeState.bpm + d));
      if(metronomeState.running) restartMetronome();
      render();
    };
  });
  const toneSeg = $("#mtrTone");
  if(toneSeg) toneSeg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    toneSeg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));
    o.classList.add("on");
    metronomeState.tone = o.dataset.v;
  });
  const tg = $("#mtrToggle");
  if(tg) tg.onclick = ()=>{
    if(metronomeState.running) stopMetronome();
    else startMetronome();
  };
}

/* ---------- 音乐：练习计时器 ---------- */
let musicTimers = {}; // { id: { iv, start, acc, key } }

function clearAllMusicTimers(){
  Object.keys(musicTimers).forEach(id=>{
    const tt = musicTimers[id];
    if(!tt) return;
    const x = (data[tt.key]||[]).find(i=>i.id==id);
    if(x) x.__timerAcc = tt.acc + (Date.now() - tt.start);
    clearInterval(tt.iv);
    delete musicTimers[id];
  });
}

function paintMtimer(wrap, x){
  const id = x.id;
  if(musicTimers[id]){
    const tt = musicTimers[id];
    const elapsed = tt.acc + (Date.now() - tt.start);
    wrap.innerHTML = `<button class="mtimer-btn running" data-act="pause">暂停 ${fmtTimer(elapsed)}</button>`;
  } else if(x.__timerAcc > 0){
    wrap.innerHTML = `<button class="mtimer-btn running" data-act="resume">继续 ${fmtTimer(x.__timerAcc)}</button><button class="mtimer-btn done-btn" data-act="done">完成</button>`;
  } else {
    wrap.innerHTML = `<button class="mtimer-btn" data-act="start">开始计时</button>`;
  }
}

function wireMusicTimer(key){
  clearAllMusicTimers();
  const screen = $("#screen"); if(!screen) return;
  screen.querySelectorAll(".mtimer-wrap").forEach(wrap=>{
    const id = wrap.dataset.mt;
    const x = (data[key]||[]).find(i=>i.id==id);
    if(!x) return;
    paintMtimer(wrap, x);
    const bind = ()=>{
      wrap.querySelectorAll(".mtimer-btn").forEach(btn=>{
        btn.onclick = e=>{
          e.stopPropagation();
          const act = btn.dataset.act;
          const tt = musicTimers[id];
          if(act === "start" || act === "resume"){
            const acc = (act === "resume") ? (x.__timerAcc || 0) : 0;
            x.__timerAcc = 0;
            musicTimers[id] = { iv:null, start:Date.now(), acc:acc, key:key };
            musicTimers[id].iv = setInterval(()=>{
              if(!musicTimers[id]) return;
              const t2 = musicTimers[id];
              const elapsed = t2.acc + (Date.now() - t2.start);
              x.__timerAcc = elapsed;
              const b = wrap.querySelector('.mtimer-btn[data-act="pause"]');
              if(b) b.textContent = "暂停 " + fmtTimer(elapsed);
            }, 1000);
            paintMtimer(wrap, x); bind();
          } else if(act === "pause"){
            if(tt){ x.__timerAcc = tt.acc + (Date.now() - tt.start); clearInterval(tt.iv); delete musicTimers[id]; }
            store.save();
            paintMtimer(wrap, x); bind();
          } else if(act === "done"){
            let ms = x.__timerAcc || 0;
            if(tt){ ms = tt.acc + (Date.now() - tt.start); clearInterval(tt.iv); delete musicTimers[id]; }
            const mins = Math.max(1, Math.round(ms / 60000));
            const cleanNote = (x.note || "").replace(/（实际\d+min）/g, "").trim();
            x.note = cleanNote ? `${cleanNote}（实际${mins}min）` : `（实际${mins}min）`;
            x.__timerAcc = 0;
            logMusicDay();
            persist();
          }
        };
      });
    };
    bind();
  });
}

/* ---------- 自媒体：内容日历 ---------- */
function ccFmtDay(year, month, d){
  return year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}

function publishDatesInMonth(pd, year, month){
  const out = [];
  if(!pd) return out;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const wdNames = ["周日","周一","周二","周三","周四","周五","周六"];
  // specific day number: "15号" / "3日"
  const mNum = pd.match(/(\d{1,2})\s*[号日]/);
  if(mNum){
    const d = +mNum[1];
    if(d>=1 && d<=daysInMonth) out.push(ccFmtDay(year, month, d));
    return out;
  }
  // weekday based (周二 / 上周二 / 周四18:30 ...)
  for(let w=0; w<7; w++){
    if(pd.indexOf(wdNames[w]) >= 0){
      const isLast = pd.indexOf("上周") >= 0;
      const matches = [];
      for(let d=1; d<=daysInMonth; d++){
        if(new Date(year, month, d).getDay() === w) matches.push(ccFmtDay(year, month, d));
      }
      if(isLast){
        const today = isoToday();
        const past = matches.filter(ds=>ds <= today);
        if(past.length) out.push(past[past.length-1]);
        else if(matches.length) out.push(matches[matches.length-1]);
      } else {
        matches.forEach(ds=>out.push(ds));
      }
      break;
    }
  }
  return out;
}

function ccPlatClass(platform){
  if(platform === "小红书") return "cc-red";
  if(platform === "抖音") return "cc-black";
  if(platform === "双平台") return "cc-multi";
  return "cc-multi";
}

function ccPlatTag(platform){
  if(platform === "小红书") return "p-xhs";
  if(platform === "抖音") return "p-dy";
  if(platform === "双平台") return "p-multi";
  return "p-multi";
}

/* ---------- 自媒体：数据分析 ---------- */
function renderMediaAnalytics(){
  const recs = data.selfmedia || [];
  const statuses = ["未用","进行中","已发布","已放弃"];
  const statusRows = statuses.map(s=>({ s:s, n:recs.filter(r=>r.status===s).length }));
  const maxStatus = Math.max(1, statusRows[0]?statusRows[0].n:0, ...statusRows.map(x=>x.n));
  const statusColors = { "未用":"var(--text-tertiary)", "进行中":"var(--module-2)", "已发布":"var(--module-3)", "已放弃":"var(--danger)" };
  const platforms = ["小红书","抖音","双平台"];
  const platRows = platforms.map(p=>({ p:p, n:recs.filter(r=>r.platform===p).length }));
  const maxPlat = Math.max(1, ...platRows.map(x=>x.n));
  const scores = recs.map(r=>+r.matchScore||0).filter(v=>v>0);
  const avgMatch = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  // trend: this month vs last month by record date
  const mr = monthRange();
  const lp = mr.start.split('-');
  const lastFirst = new Date(+lp[0], +lp[1]-2, 1);
  const lastEnd = new Date(+lp[0], +lp[1]-1, 0);
  const lastStart = ymd(lastFirst), lastEndStr = ymd(lastEnd);
  let thisMonth = 0, lastMonth = 0;
  recs.forEach(r=>{
    if(!r.date) return;
    if(r.date >= mr.start && r.date <= mr.end) thisMonth++;
    else if(r.date >= lastStart && r.date <= lastEndStr) lastMonth++;
  });
  const delta = thisMonth - lastMonth;
  const deltaTxt = delta > 0 ? `↑${delta}` : (delta < 0 ? `↓${Math.abs(delta)}` : '持平');
  const deltaCls = delta > 0 ? 'up' : (delta < 0 ? 'down' : '');

  const statusHtml = statusRows.map(r=>`<div class="ap-row">
    <span class="ap-lab">${esc(r.s)}</span>
    <span class="ap-bar"><i style="width:${Math.round(r.n/maxStatus*100)}%;background:${statusColors[r.s]}"></i></span>
    <span class="ap-val">${r.n}</span></div>`).join("");
  const platHtml = platRows.map(r=>`<div class="ap-row">
    <span class="ap-lab">${esc(r.p)}</span>
    <span class="ap-bar"><i style="width:${Math.round(r.n/maxPlat*100)}%"></i></span>
    <span class="ap-val">${r.n}</span></div>`).join("");

  return `<div class="analytics-panel">
    <div class="ap-head">${icon("trending",15)} 数据分析</div>
    <div class="ap-sec">
      <div class="ap-sec-title">内容状态分布</div>
      ${statusHtml}
    </div>
    <div class="ap-sec">
      <div class="ap-sec-title">平台内容数量</div>
      ${platHtml}
    </div>
    <div class="ap-summary">
      <div class="ap-cell"><div class="ap-v">${avgMatch}</div><div class="ap-l">平均匹配度</div></div>
      <div class="ap-cell"><div class="ap-v">${thisMonth}</div><div class="ap-l">本月新增</div><div class="ap-delta ${deltaCls}">${deltaTxt}</div></div>
    </div>
  </div>`;
}

$("#drawerBrand").onclick = () => $("#avatarInput").click();
$("#avatarInput").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => { data.__avatar = reader.result; $("#brandImg").src = reader.result; $("#brandImg").style.display="block"; $("#brandDefault").style.display="none"; store.save(); };
  reader.readAsDataURL(f);
  e.target.value = "";
};

/* ---------- data sync (export / import) ---------- */
$("#btnExport").onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  a.href = url;
  a.download = `xiaolan-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(url);
};
$("#btnImport").onclick = () => $("#importInput").click();
$("#importInput").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if(!imported || typeof imported !== "object") throw new Error("format");
      data = imported;
      store.save();
      render();
      alert("导入成功！数据已更新。");
    } catch(err) {
      alert("导入失败：文件格式不正确。");
    }
  };
  reader.readAsText(f);
  e.target.value = "";
};

/* ---------- utils ---------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }

buildDrawer();
render();
