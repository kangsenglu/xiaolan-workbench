  /* ---------- (drawer/scrim removed — sidebar replaces them) ---------- */

  /* ---------- modal ---------- */
  .overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--text) 44%, transparent); backdrop-filter: blur(3px); z-index: 60;
    display:flex; align-items:center; justify-content:center; animation: fade .16s ease; }
  @keyframes fade { from { opacity:0; } }
  .modal { background: var(--surface-card); border-radius: 20px; padding: 26px; width: 480px; max-width: 92vw; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 24px 60px color-mix(in srgb, var(--text) 26%, transparent); animation: pop .18s cubic-bezier(.2,.8,.3,1); }
  @keyframes pop { from { transform: translateY(10px) scale(.98); opacity:0; } }
  .modal .grab { display: none; }
  .modal h2 { font-size: 19px; font-weight: 800; letter-spacing:-.01em; }
  .modal .sub { color: var(--text-secondary); font-size: 13px; margin: 5px 0 18px; }
  .field { margin-bottom: 13px; }
  .field label { display:block; color: var(--text-secondary); font-size: 12px; margin-bottom: 6px; }
  input, select, textarea { font-family: var(--font); font-size: 15px; border: 1px solid var(--border-input); border-radius: var(--radius-tile);
    padding: 11px 12px; background: var(--surface-card); color: var(--text); outline:none; width: 100%; transition: border-color .15s, box-shadow .15s; }
  textarea { resize: vertical; min-height: 74px; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-muted); }
  .frow { display:flex; gap: 10px; }
  .frow .field { flex:1; }
  .seg { display:flex; gap: 8px; }
  .seg .opt { flex:1; text-align:center; padding: 10px; border-radius: var(--radius-tile); border: 1px solid var(--border-input);
    cursor:pointer; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .seg .opt.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .modal-actions { display:flex; align-items:center; gap: 10px; margin-top: 18px; }
  .btn { flex:1; background: var(--accent); color:var(--on-accent); border:none; border-radius: var(--radius-tile); padding: 13px; font-size: 15px; font-weight: 700; cursor:pointer; }
  .btn.ghost { flex: 0 0 auto; background: var(--surface-nested); color: var(--text-secondary); border: 1px solid var(--border-input); padding: 13px 20px; }
  .btn.danger { background: var(--danger); }
  .link-danger { color: var(--danger); background:none; border:none; font-size: 14px; font-weight: 600; cursor:pointer; }

  /* ---------- insight charts ---------- */
  .bar-list { display:flex; flex-direction:column; gap:11px; margin-top:14px; }
  .bar-row { display:flex; align-items:center; gap:10px; }
  .bar-ic { width:30px; height:30px; border-radius:var(--radius-tile); display:grid; place-items:center; flex:0 0 auto;
    background:var(--surface-nested); border:1px solid var(--border); }
  .bar-name { font-size:13px; font-weight:600; width:64px; flex:0 0 auto; color:var(--text); }
  .bar-row .pbar { flex:1; margin:0; height:7px; }
  .bar-pct { font-size:12px; font-weight:600; color:var(--text-secondary); width:54px; text-align:right; flex:0 0 auto; }

  .donut-wrap { display:flex; gap:18px; align-items:center; margin-top:14px; }
  .donut { position:relative; width:104px; height:104px; flex:0 0 auto; }
  .donut svg { transform:rotate(-90deg); width:104px; height:104px; }
  .donut-mid { position:absolute; inset:0; display:grid; place-items:center; font-size:13px; font-weight:800; color:var(--text); text-align:center; line-height:1.2; }
  .donut-legend { flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .legend-item { display:flex; align-items:center; gap:8px; font-size:12.5px; }
  .legend-dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .legend-name { color:var(--text); font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .legend-amt { color:var(--text); font-weight:700; font-variant-numeric:tabular-nums; }
  .legend-pct { color:var(--text-secondary); width:38px; text-align:right; font-variant-numeric:tabular-nums; }
  .donut-empty { width:68px; height:68px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; color:var(--text-tertiary); font-size:10px; }

  /* ---------- calendar grid ---------- */
  .cal-panel { margin-top:12px; }
  .cal-hd { display:flex; align-items:center; gap:10px; }
  .cal-nav { width:30px; height:30px; border-radius:var(--radius-tile); border:1px solid var(--border-input); background:var(--surface-nested);
    color:var(--text); cursor:pointer; display:grid; place-items:center; transition: all .15s; }
  .cal-nav:active { background:var(--accent-muted); border-color:var(--accent); }
  .cal-nav[data-cal="prev"] svg { transform: scaleX(-1); }
  .cal-title { flex:1; text-align:center; font-size:14px; font-weight:700; color:var(--text); }
  .cal-chips { display:flex; gap:6px; overflow-x:auto; margin:12px 0 10px; padding-bottom:2px; scrollbar-width:none; }
  .cal-chips::-webkit-scrollbar { display:none; }
  .cal-chip { flex:0 0 auto; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px;
    border:1px solid var(--border-input); background:var(--surface-card); color:var(--text-secondary); cursor:pointer; white-space:nowrap; transition: all .15s;
    font-family:var(--font); }
  .cal-chip.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .cal-dow { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:12px; color:var(--text-tertiary); font-weight:600; margin-bottom:6px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-cell { aspect-ratio:1; border-radius:var(--radius-control); display:grid; place-items:center; font-size:12px; font-weight:600;
    color:var(--text-secondary); background:var(--surface-nested); border:1px solid var(--border); cursor:pointer; transition: all .15s;
    font-family:var(--font); }
  .cal-cell.blank { background:transparent; border:none; cursor:default; }
  .cal-cell.on { color:#fff; }
  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-cell:active { transform: scale(.92); }
  .cal-toast { position:fixed; left:50%; bottom:16px; transform:translateX(-50%) translateY(16px);
    background:var(--text); color:var(--surface-card); font-size:13px; font-weight:600; padding:11px 16px; border-radius:999px;
    box-shadow:var(--shadow-overlay); z-index:70; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; display:flex; align-items:center; gap:10px; }
  .cal-toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .cal-toast button { background:var(--module-2); color:#fff; border:none; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:var(--font); }
  .cal-foot { margin-top:12px; font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
  .cal-foot svg { color:var(--module-3); }

  /* ---------- finance privacy toggle ---------- */
  .privacy-toggle { display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:8px 14px;
    border-radius:999px; border:1px solid var(--border-input); background:var(--surface-nested);
    color:var(--text-secondary); font-size:12px; font-weight:600; cursor:pointer; transition:all .15s; }
  .privacy-toggle:active { background:var(--accent-muted); border-color:var(--accent); }
  .privacy-toggle svg { color:var(--text-tertiary); }
  .finance-privacy .amt,
  .finance-privacy .mini .v { filter:blur(7px); user-select:none; transition:filter .2s; }

  /* ---------- period tracker ---------- */
  .period-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); padding:16px 18px; margin-top:14px; }
  .period-card .pc-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .period-card .pc-head .pc-ic { width:36px; height:36px; border-radius:var(--radius-tile); display:grid; place-items:center;
    flex:0 0 auto; }
  .period-card .pc-head .pc-tx { flex:1; min-width:0; }
  .period-card .pc-head .pc-tx .pc-ph { font-size:15px; font-weight:700; }
  .period-card .pc-head .pc-tx .pc-sub { font-size:12px; color:var(--text-secondary); margin-top:2px; }
  .period-card .pc-head .pc-day { font-size:24px; font-weight:800; letter-spacing:-.03em; line-height:1; }
  .period-card .pc-head .pc-day small { font-size:12px; font-weight:500; color:var(--text-secondary); margin-left:4px; }
  .period-card .pc-bar { height:6px; border-radius:999px; background:var(--border); overflow:hidden; margin:10px 0 8px; position:relative; }
  .period-card .pc-bar i { display:block; height:100%; border-radius:999px; }
  .period-card .pc-phase-row { display:flex; gap:4px; margin-top:8px; }
  .period-card .pc-phase-tag { flex:1; text-align:center; font-size:10px; font-weight:600; padding:5px 4px; border-radius:var(--radius-control);
    background:var(--surface-nested); color:var(--text-tertiary); border:1px solid transparent; }
  .period-card .pc-phase-tag.on { color:#fff; }
  .period-card .pc-info { display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:12px; font-size:12px; color:var(--text-secondary); }
  .period-card .pc-info b { color:var(--text); font-weight:700; }
  .period-card .pc-actions { display:flex; gap:8px; margin-top:12px; }
  .period-card .pc-btn { flex:1; padding:10px; border-radius:var(--radius-tile); border:1px solid var(--border-input);
    background:var(--surface-nested); color:var(--text); font-size:13px; font-weight:600; cursor:pointer; text-align:center; transition:all .15s; }
  .period-card .pc-btn:active { transform:scale(.97); }
  .period-card .pc-btn.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .period-card .pc-tips { margin-top:10px; padding:10px 12px; border-radius:var(--radius-tile); background:var(--surface-nested);
    font-size:12px; color:var(--text-secondary); line-height:1.6; }
  .period-card .pc-tips b { color:var(--text); }

  /* ---------- daily dynamic card ---------- */
  .daily-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); padding:14px 16px; margin-bottom:9px; }
  .daily-card .dc-head { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; margin-bottom:8px; }
  .daily-card .dc-head svg { color:var(--text-tertiary); }
  .daily-card .dc-head .dc-tag { margin-left:auto; font-size:10px; font-weight:600; padding:3px 8px; border-radius:999px; }
  .daily-card .dc-body { font-size:13px; color:var(--text-secondary); line-height:1.6; }
  .daily-card .dc-body b { color:var(--text); }
  .daily-card .dc-body .dc-item { display:flex; gap:8px; margin-bottom:5px; }
  .daily-card .dc-body .dc-item:last-child { margin-bottom:0; }
  .daily-card .dc-body .dc-dot { width:5px; height:5px; border-radius:50%; margin-top:7px; flex:0 0 auto; }
  .dc-link { display:inline-flex; align-items:center; gap:3px; margin-left:8px; padding:3px 9px; border-radius:8px; background:var(--surface-nested); color:var(--accent); font-size:11px; font-weight:600; text-decoration:none; }
  .dc-link:active { opacity:.7; }

  /* ====== V6.0 今日模式 ====== */
  .mode-toggle { display:flex; gap:0; border-radius:10px; overflow:hidden; border:1px solid var(--border); margin-bottom:14px; }
  .mode-toggle button { flex:1; padding:8px 0; font-size:12px; font-weight:600; border:none; background:var(--surface-nested); color:var(--text-secondary); transition:all .2s; }
  .mode-toggle button.on { background:var(--accent); color:#fff; }
  .mode-toggle button:first-child { border-right:none; }

  /* 动态问候语 */
  .v6-greet { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); padding:16px; margin-bottom:14px; }
  .v6-greet .g1 { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:800; flex-wrap:wrap; }
  .v6-greet .g1 .phase-tag { font-size:10px; font-weight:600; padding:3px 8px; border-radius:999px; margin-left:auto; }
  .v6-greet .g1 .phase-mark-btn { font-size:10px; font-weight:600; padding:3px 9px; border-radius:999px; border:1px solid var(--danger); background:var(--danger-muted); color:var(--danger); cursor:pointer; display:inline-flex; align-items:center; gap:3px; }
  .brief-more-bar { text-align:center; margin-top:10px; }
  .brief-more-btn { font-size:12px; font-weight:600; padding:8px 16px; border-radius:999px; border:1px solid var(--border-input); background:var(--surface-card); color:var(--accent); cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .brief-more-btn:active { background:var(--accent-muted); }
  .v6-greet .g2 { font-size:13px; color:var(--text-secondary); margin-top:8px; line-height:1.6; }
  .v6-greet .g3 { display:flex; align-items:center; gap:6px; margin-top:10px; font-size:11px; color:var(--text-tertiary); }
  .v6-greet .g3 .e-bar { flex:1; height:5px; border-radius:3px; background:var(--surface-nested); overflow:hidden; }
  .v6-greet .g3 .e-bar i { display:block; height:100%; border-radius:3px; }

  /* 时间轴 */
  .timeline { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); padding:14px 16px; margin-bottom:14px; }
  .tl-head { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; margin-bottom:12px; }
  .tl-head svg { color:var(--text-tertiary); }
  .tl-item { display:flex; gap:12px; padding-bottom:14px; position:relative; }
  .tl-item:last-child { padding-bottom:0; }
  .tl-item::before { content:''; position:absolute; left:11px; top:24px; bottom:0; width:2px; background:var(--border); }
  .tl-item:last-child::before { display:none; }
  .tl-dot { width:24px; height:24px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:10px; z-index:1; }
  .tl-dot.done { background:var(--module-1); color:#fff; }
  .tl-dot.now { background:var(--accent); color:#fff; }
  .tl-dot.todo { background:var(--surface-nested); color:var(--text-tertiary); border:2px solid var(--border); }
  .tl-dot.skip { background:var(--surface-nested); color:var(--text-tertiary); opacity:.5; }
  .tl-body { flex:1; min-width:0; }
  .tl-time { font-size:10px; color:var(--text-tertiary); font-weight:600; }
  .tl-title { font-size:13px; font-weight:600; margin-top:2px; }
  .tl-title.done { text-decoration:line-through; color:var(--text-tertiary); }
  .tl-title.skip { color:var(--text-tertiary); }
  .tl-cta { display:inline-flex; align-items:center; gap:4px; margin-top:6px; padding:4px 12px; border-radius:8px; background:var(--accent); color:#fff; font-size:11px; font-weight:600; border:none; }
  .tl-cta:active { opacity:.8; }
  .tl-cta.done { background:var(--module-1); }
  .tl-link { display:inline-flex; align-items:center; gap:3px; margin-left:8px; font-size:10px; color:var(--accent); text-decoration:none; }

  /* 3+1 核心任务 */
  .core-tasks { margin-bottom:14px; }
  .core-task { display:flex; align-items:center; gap:10px; background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); padding:12px 14px; margin-bottom:8px; }
  .core-task.optional { border-style:dashed; opacity:.8; }
  .core-chk { width:24px; height:24px; border-radius:50%; border:2px solid var(--border); flex:0 0 auto; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .core-chk.on { background:var(--module-1); border-color:var(--module-1); color:#fff; }
  .core-info { flex:1; min-width:0; }
  .core-info .ct-title { font-size:13px; font-weight:600; }
  .core-info .ct-title.done { text-decoration:line-through; color:var(--text-tertiary); }
  .core-info .ct-sub { font-size:11px; color:var(--text-tertiary); margin-top:2px; }
  .core-link { font-size:10px; color:var(--accent); text-decoration:none; display:inline-flex; align-items:center; gap:3px; }

  /* 交互简报 */
  .brief-interactive { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); padding:14px 16px; margin-bottom:14px; }
  .bi-row { padding:10px 0; border-top:1px solid var(--border); }
  .bi-row:first-of-type { border-top:none; padding-top:0; }
  .bi-row.read { opacity:.4; }
  .bi-row .bi-actions { display:flex; gap:6px; margin-top:6px; }
  .bi-actions button { padding:3px 10px; border-radius:6px; border:1px solid var(--border); background:var(--surface-nested); color:var(--text-secondary); font-size:10px; font-weight:600; }
  .bi-actions button:active { opacity:.7; }
  .bi-actions button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* 状态不好按钮 */
  .low-mode-bar { display:flex; gap:8px; margin-bottom:14px; }
  .low-mode-btn { flex:1; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--surface-nested); color:var(--text-secondary); font-size:11px; font-weight:600; text-align:center; }
  .low-mode-btn:active { opacity:.7; }

  /* 搜索结果 */
  .search-group { margin-bottom:12px; }
  .sg-head { font-size:12px; font-weight:700; color:var(--text-tertiary); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .sg-item { padding:10px; border-radius:var(--radius-tile); background:var(--surface-nested); margin-bottom:4px; cursor:pointer; }
  .sg-item:active { opacity:.7; }
  .sg-title { font-size:13px; font-weight:600; }
  .sg-sub { font-size:11px; color:var(--text-tertiary); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- selfmedia growth tracker ---------- */
  .growth-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:14px; }
  .growth-mini { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile);
    box-shadow:var(--shadow-card); padding:12px; }
  .growth-mini .l { font-size:11px; color:var(--text-secondary); }
  .growth-mini .v { font-size:18px; font-weight:800; margin-top:3px; letter-spacing:-.02em; }
  .growth-mini .v small { font-size:11px; font-weight:500; color:var(--text-secondary); margin-left:4px; }

  .hidden { display: none !important; }

  /* 每日简报卡片 */
  .brief-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); padding:14px 16px; }
  .brief-card .bc-head { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; margin-bottom:10px; }
  .brief-card .bc-head svg { color:var(--text-tertiary); }
  .brief-card .bc-head .bc-date { margin-left:auto; font-size:10px; font-weight:500; color:var(--text-tertiary); }
  .brief-item { padding:10px 0; border-top:1px solid var(--border); }
  .brief-item:first-of-type { border-top:none; padding-top:0; }
  .brief-item .bi-title { font-size:13px; font-weight:700; margin-bottom:4px; }
  .brief-item .bi-content { font-size:12px; color:var(--text-secondary); line-height:1.6; }
  .brief-item .bi-source { font-size:10px; color:var(--text-tertiary); margin-top:4px; }
  .brief-item .bi-link { display:inline-flex; align-items:center; gap:3px; margin-top:6px; padding:4px 10px; border-radius:8px; background:var(--surface-nested); color:var(--accent); font-size:11px; font-weight:600; text-decoration:none; }
  .brief-item .bi-link:active { opacity:.7; }
  .brief-diet { font-size:12px; color:var(--text-secondary); line-height:1.6; padding:8px 10px; border-radius:var(--radius-tile); background:var(--surface-nested); margin-bottom:8px; }
  .brief-kp-grid { display:grid; grid-template-columns:1fr; gap:8px; }
  .brief-kp { padding:8px 10px; border-radius:var(--radius-tile); background:var(--surface-nested); border-left:3px solid var(--accent); }
  .brief-kp .bi-title { font-size:12px; }
  .brief-kp .bi-content { font-size:11px; margin-top:2px; }
  .brief-kp .bi-link { font-size:10px; padding:3px 8px; margin-top:4px; }
  .brief-trend { font-size:12px; color:var(--text-secondary); line-height:1.6; padding:8px 10px; border-radius:var(--radius-tile); background:var(--surface-nested); margin-bottom:8px; border-left:3px solid var(--module-4); }
  .brief-section-label { font-size:11px; font-weight:700; color:var(--text-tertiary); margin:10px 0 4px; letter-spacing:.05em; }
  .brief-rlinks { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .brief-rlinks a { font-size:11px; padding:4px 10px; border-radius:8px; background:var(--surface-nested); color:var(--module-4); text-decoration:none; font-weight:600; }
  .brief-rlinks a:active { opacity:.7; }
  .bi-img { width:100%; max-height:180px; object-fit:cover; border-radius:var(--radius-tile); margin-bottom:8px; }
  .bi-img-sm { max-height:100px; }

  /* 能量指数卡片 */
  .energy-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); padding:16px; }
  .energy-card .ec-head { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
  .energy-card .ec-dial { position:relative; width:56px; height:56px; flex:0 0 auto; }
  .energy-card .ec-dial .gauge { width:56px; height:56px; }
  .energy-card .ec-mid { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
  .energy-card .ec-score { font-size:28px; font-weight:800; line-height:1; }

  /* ===== V6.0 学习模块升级 ===== */
  .learn-panel { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); padding:14px 16px; margin-top:14px; }
  .learn-panel .lp-head { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; margin-bottom:12px; color:var(--text); }

  .learn-panel .lp-val { font-size:20px; font-weight:800; color:var(--text); line-height:1.2; }
  .learn-panel .lp-lab { font-size:10px; color:var(--text-tertiary); margin-top:2px; }

  .learn-panel .lp-bar { height:6px; background:var(--surface-nested); border-radius:3px; overflow:hidden; }
  .learn-panel .lp-bar i { display:block; height:100%; border-radius:3px; transition:width .4s; }

  .review-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); padding:14px 16px; margin-top:12px; }

  .timer-btn { display:inline-flex; align-items:center; gap:4px; margin-top:8px; border:1px solid var(--border-input); background:var(--surface-nested); color:var(--text-secondary); font-size:11px; font-weight:600; padding:5px 12px; border-radius:var(--radius-control); cursor:pointer; }

  .wordbook-entry { margin-top:14px; }

    background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);

  /* ============================================================
     V6.0 专业赋能模块样式
     ============================================================ */

  /* ---- 阅读进度面板 ---- */
  .read-progress { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile);

  .read-progress .rp-head svg { color:var(--text-tertiary); }
  .read-progress .rp-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:11px; }
  .read-progress .rp-stat { text-align:center; padding:8px 4px; border-radius:var(--radius-control); background:var(--surface-nested); }
  .read-progress .rp-stat .n { font-size:18px; font-weight:800; letter-spacing:-.02em; }
  .read-progress .rp-stat .l { font-size:10.5px; color:var(--text-secondary); margin-top:2px; }
  .read-progress .rp-bar { height:6px; border-radius:999px; background:var(--border); overflow:hidden; margin-top:11px; }
  .read-progress .rp-bar i { display:block; height:100%; border-radius:999px; background:var(--module-2); }
  /* 状态圆点颜色：未读/已读摘要/精读中/已读完/已归档 */

  .rs-dot.s-abstract { background:var(--module-3); border-color:#b07f28; }
  .rs-dot.s-reading { background:var(--module-2); border-color:#2f6ab0; }
  .rs-dot.s-done { background:var(--module-1); border-color:#2f7449; }
  .rs-dot.s-archived { background:var(--text-tertiary); border-color:#6b7d90; }

  /* ---- 每日测试面板 ---- */
  .quiz-panel { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile);
    box-shadow:var(--shadow-card); padding:14px; margin-top:14px; }
  .quiz-panel .qp-head { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; }
  .quiz-panel .qp-head svg { color:var(--text-tertiary); }
  .quiz-panel .qp-head .qp-date { margin-left:auto; font-size:11px; color:var(--text-secondary); font-weight:500; }
  .quiz-panel .qp-score { font-size:12px; color:var(--text-secondary); margin-top:8px; }
  .quiz-panel .qp-score b { color:var(--module-2); font-size:15px; }
  .quiz-q { background:var(--surface-nested); border:1px solid var(--border); border-radius:var(--radius-control);
    padding:11px 12px; margin-top:10px; }
  .quiz-q .qq-title { font-size:13px; font-weight:600; color:var(--text); line-height:1.5; }
  .quiz-q .qq-title .qq-no { color:var(--accent); font-weight:700; margin-right:5px; }
  .quiz-opt { display:block; width:100%; text-align:left; margin-top:8px; padding:9px 12px; border-radius:var(--radius-control);

  .quiz-opt:active { transform:scale(.98); }

  .quiz-opt.correct { background:#e8f3ec; border-color:var(--module-1); color:var(--module-1); font-weight:700; }
  .quiz-opt.wrong { background:var(--danger-muted); border-color:var(--danger); color:var(--danger); font-weight:700; }
  .quiz-opt:disabled { cursor:default; opacity:.85; }

  .quiz-q .qq-explain b { color:var(--module-1); }

  .quiz-panel .qp-empty { font-size:12px; color:var(--text-tertiary); text-align:center; padding:18px 10px; line-height:1.7; }

  /* ---- 工作目标关联面板 ---- */

  .goal-row .gr-count { font-size:11px; color:var(--text-secondary); background:var(--surface-nested); padding:2px 8px; border-radius:999px; flex:0 0 auto; }

  .field .rs-legend .rs-opt { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px;
    font-size:12px; font-weight:600; border:1px solid var(--border-input); background:var(--surface-card); color:var(--text-secondary); cursor:pointer; }
  .field .rs-legend .rs-opt.on { background:var(--accent-muted); border-color:var(--accent); color:var(--accent); }

  /* ===== V6.0 音乐工坊模块升级：节拍器 / 计时器 / 练习提醒 ===== */
  .metronome { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); padding:16px; margin-bottom:14px; }

  .metronome .mtr-head svg { color:var(--module-3); }
  .metronome .mtr-body { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .metronome .bpm-display { font-size:46px; font-weight:800; color:var(--module-3); line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .metronome .bpm-label { font-size:11px; font-weight:700; color:var(--text-tertiary); letter-spacing:.1em; margin-top:-6px; }
  .metronome .bpm-ctrl { display:flex; gap:8px; width:100%; justify-content:center; }
  .metronome .bpm-btn { flex:0 0 auto; min-width:54px; border:1px solid var(--border-input); background:var(--surface-nested);
    color:var(--text-secondary); font-size:12px; font-weight:700; padding:8px 0; border-radius:var(--radius-control); cursor:pointer; }
  .metronome .bpm-btn:active { transform:scale(.95); background:var(--surface-card); }
  .metronome .mtr-tone { width:100%; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

    padding:11px 0; border-radius:var(--radius-tile); cursor:pointer; margin-top:4px; }

  .metronome .mtr-toggle:active { transform:scale(.98); }

  .mtimer-wrap { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .mtimer-btn { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--border-input); background:var(--surface-nested);
    color:var(--text-secondary); font-size:11px; font-weight:600; padding:5px 12px; border-radius:var(--radius-control); cursor:pointer; }
  .mtimer-btn.running { background:var(--module-3); color:#fff; border-color:var(--module-3); }
  .mtimer-btn.done-btn { background:var(--surface-card); color:var(--module-3); border-color:var(--module-3); }
  .mtimer-btn:active { transform:scale(.96); }

  .music-reminder { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); padding:14px 16px; margin-bottom:14px; }
  .music-reminder .mr-head { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--text); margin-bottom:8px; }
  .music-reminder .mr-head svg { color:var(--module-3); }
  .music-reminder .mr-msg { font-size:13px; color:var(--text-secondary); line-height:1.5; }
  .music-reminder .mr-mvp { display:inline-flex; align-items:center; gap:4px; margin-top:10px; border:1px dashed var(--module-3);

  .music-reminder .mr-mvp:active { transform:scale(.97); }

  .music-reminder .mr-mvp-detail .mvp-title { font-size:12px; font-weight:700; color:var(--module-3); margin-bottom:6px; }
  .music-reminder .mr-mvp-detail .mvp-item { font-size:12px; color:var(--text-secondary); line-height:1.6; display:flex; gap:6px; }
  .music-reminder .mr-mvp-detail .mvp-item::before { content:"·"; color:var(--module-3); font-weight:800; }

  /* ===== V6.0 自媒体模块升级：模板库 / 内容日历 / 分析面板 ===== */
  .template-lib { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); padding:14px 16px; margin-bottom:14px; }
  .template-lib .tl-head { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--text); margin-bottom:10px; }
  .template-lib .tl-head svg { color:var(--danger); }
  .template-lib .tpl-group { margin-top:10px; }
  .template-lib .tpl-group:first-of-type { margin-top:0; }
  .template-lib .tpl-cat { font-size:11px; font-weight:700; color:var(--danger); margin-bottom:6px; padding-left:2px; }

  .tpl-card .tpl-btn { flex:0 0 auto; border:1px solid var(--border-input); background:var(--surface-card); color:var(--text-secondary);

  .tpl-card .tpl-btn.primary { background:var(--danger); color:#fff; border-color:var(--danger); }
  .tpl-card .tpl-btn:active { transform:scale(.96); }

  .content-cal { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); padding:14px 16px; margin-bottom:14px; }
  .content-cal .cc-head { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--text); margin-bottom:10px; }
  .content-cal .cc-head svg { color:var(--danger); }
  .content-cal .cc-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .content-cal .cc-dow { text-align:center; font-size:10px; font-weight:700; color:var(--text-tertiary); padding:4px 0; }
  .content-cal .cc-day { aspect-ratio:1/1; border-radius:var(--radius-control); background:var(--surface-nested);
    display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; font-size:12px; color:var(--text-secondary); }
  .content-cal .cc-day.blank { background:transparent; }
  .content-cal .cc-day.today { outline:2px solid var(--accent); outline-offset:-2px; }
  .content-cal .cc-day.has { cursor:pointer; }
  .content-cal .cc-day.has .cc-num { font-weight:700; color:var(--text); }
  .content-cal .cc-day.cc-red.has { background:#fdecec; }
  .content-cal .cc-day.cc-black.has { background:#ececec; }

  .content-cal .cc-day.cc-red.has .cc-dot { background:#e74c5e; }
  .content-cal .cc-day.cc-black.has .cc-dot { background:#222; }
  .content-cal .cc-day.cc-multi.has .cc-dot { background:#8a5cd0; }
  .content-cal .cc-legend { display:flex; gap:12px; margin-top:10px; flex-wrap:wrap; }
  .content-cal .cc-leg { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--text-secondary); }
  .content-cal .cc-leg::before { content:""; width:8px; height:8px; border-radius:2px; display:inline-block; }
  .content-cal .cc-leg.cc-red::before { background:#fdecec; border:1px solid #e74c5e; }
  .content-cal .cc-leg.cc-black::before { background:#ececec; border:1px solid #222; }
  .content-cal .cc-leg.cc-multi::before { background:#f0eaf6; border:1px solid #8a5cd0; }
  .content-cal .cc-detail { margin-top:10px; }
  .content-cal .cc-detail:empty { display:none; }
  .content-cal .ccd-date { font-size:12px; font-weight:700; color:var(--text); margin-bottom:6px; }
  .content-cal .ccd-item { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--border); font-size:12px; }
  .content-cal .ccd-item:first-of-type { border-top:none; }
  .content-cal .ccd-plat { font-size:10px; font-weight:700; padding:2px 7px; border-radius:8px; flex:0 0 auto; color:#fff; }
  .content-cal .ccd-plat.p-xhs { background:#e74c5e; }
  .content-cal .ccd-plat.p-dy { background:#222; }
  .content-cal .ccd-plat.p-multi { background:#8a5cd0; }
  .content-cal .ccd-title { flex:1; min-width:0; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .content-cal .ccd-time { font-size:11px; color:var(--text-tertiary); flex:0 0 auto; }
  .content-cal .ccd-empty { font-size:12px; color:var(--text-tertiary); text-align:center; padding:8px 0; }

  .analytics-panel { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); padding:14px 16px; margin-top:14px; }
  .analytics-panel .ap-head { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--text); margin-bottom:12px; }
  .analytics-panel .ap-head svg { color:var(--danger); }
  .analytics-panel .ap-sec { margin-top:12px; }
  .analytics-panel .ap-sec:first-of-type { margin-top:0; }
  .analytics-panel .ap-sec-title { font-size:11px; font-weight:700; color:var(--text-tertiary); margin-bottom:8px; }
  .analytics-panel .ap-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }

  .analytics-panel .ap-row .ap-bar i { display:block; height:100%; border-radius:4px; background:var(--danger); transition:width .4s; }
  .analytics-panel .ap-row .ap-val { font-size:12px; font-weight:700; color:var(--text); flex:0 0 28px; text-align:right; }
  .analytics-panel .ap-summary { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px; }
  .analytics-panel .ap-cell { text-align:center; padding:10px 6px; border-radius:var(--radius-tile); background:var(--surface-nested); }
  .analytics-panel .ap-cell .ap-v { font-size:18px; font-weight:800; color:var(--danger); line-height:1.1; }
  .analytics-panel .ap-cell .ap-l { font-size:10px; color:var(--text-tertiary); margin-top:3px; }

  /* ============================================================
     DESKTOP LAYOUT ENHANCEMENTS — 桌面端网格增强
     ============================================================ */
  /* 多列卡片网格 */
  .pin-list { grid-template-columns: repeat(2, 1fr); }
  .quick-grid { grid-template-columns: repeat(4, 1fr); }
  .mod-summary { grid-template-columns: repeat(4, 1fr); }
  .growth-grid { grid-template-columns: repeat(4, 1fr); }
  .learn-panel .lp-grid { grid-template-columns: repeat(4, 1fr); }
  .learn-stats .ls-grid { grid-template-columns: repeat(3, 1fr); }
  .compare-panel .mc-grid { grid-template-columns: repeat(3, 1fr); }
  .read-progress .rp-stats { grid-template-columns: repeat(3, 1fr); }
  .analytics-panel .ap-summary { grid-template-columns: repeat(4, 1fr); }
  .brief-kp-grid { grid-template-columns: repeat(2, 1fr); }

  /* 记录列表多列 */
  .rec-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; }
  .rec-grid > .rec { margin-bottom: 0; }

  /* 搜索框 */

  .search-box svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); pointer-events:none; }
  .search-box input { padding-left:34px; }

  /* 工具栏按钮 */
  .toolbar { display:flex; align-items:center; gap:10px; margin: 14px 0 12px; flex-wrap:wrap; }
  .btn.ghost { background:var(--surface-card); color:var(--text-secondary); border:1px solid var(--border-input); box-shadow:none; font-weight:500; }
  .btn.ghost:hover { color:var(--text); }

  /* 间距调整 */
  .greet { margin-top: 0; }
  .panel.trend-panel { margin-top: 0; }
  .rings { padding: 20px 6px; margin-top: 0; }

/* ---------- PERIOD TRACKING ---------- */
function getPeriodData(){
  if(!data.__period) data.__period = { lastStart: null, history: [] };
  return data.__period;
}
function getAvgCycle(){
  const pd = getPeriodData();
  const hist = (pd.history||[]).filter(h=>h.date);
  if(hist.length < 2) return CONFIG.period.cycleLength;
  const intervals = [];
  for(let i=1; i<hist.length; i++){
    const d1 = new Date(hist[i-1].date), d2 = new Date(hist[i].date);
    intervals.push(Math.round((d2-d1)/86400000));
  }
  const avg = Math.round(intervals.reduce((a,b)=>a+b,0)/intervals.length);
  return (avg>=21 && avg<=45) ? avg : CONFIG.period.cycleLength;
}
function calcPeriodPhase(){
  const pd = getPeriodData();
  if(!pd.lastStart) return null;
  const cycle = getAvgCycle();
  const last = new Date(pd.lastStart);
  const todayD = new Date(isoToday());
  const diffDays = Math.floor((todayD - last) / 86400000) + 1;
  const cycleDay = ((diffDays - 1) % cycle) + 1;
  const phase = CONFIG.period.phases.find(p => cycleDay >= p.start && cycleDay <= p.end) || CONFIG.period.phases[0];
  const nextStart = new Date(last);
  nextStart.setDate(nextStart.getDate() + cycle * Math.ceil(diffDays / cycle));
  const daysToNext = Math.ceil((nextStart - todayD) / 86400000);
  return { cycleDay, phase, daysToNext, nextStart: nextStart.toISOString().slice(0,10), diffDays, avgCycle: cycle };
}
function markPeriodStart(){
  const pd = getPeriodData();
  const todayIso = isoToday();
  pd.lastStart = todayIso;
  pd.history = pd.history || [];
  pd.history.push({ date: todayIso });
  store.save();
  render();
}
function markPeriodEnd(){
  const pd = getPeriodData();
  if(pd.history && pd.history.length){
    pd.history[pd.history.length-1].endDate = isoToday();
  }
  store.save();
  render();
}

/* ---------- ENERGY INDEX ---------- */
function calcEnergyScore(){
  const pp = calcPeriodPhase();
  let score = 50;
  let factors = [];
  // Period phase contribution (30pts)
  if(pp){
    const phaseScore = Math.round(pp.phase.intensity * 30);
    score += phaseScore;
    factors.push({label:"经期阶段", value:phaseScore, max:30, icon:"sun"});
  } else {
    score += 25; factors.push({label:"默认", value:25, max:30, icon:"sun"});
  }
  // Sleep checkin (20pts)
  const sleepItem = (data.health||[]).find(x=>x.title && x.title.includes("23:30"));
  if(sleepItem && sleepItem.log && sleepItem.log[today()]){
    score += 20; factors.push({label:"早睡打卡", value:20, max:20, icon:"moon"});
  } else {
    factors.push({label:"早睡未打卡", value:0, max:20, icon:"moon"});
  }
  // Exercise completion (30pts)
  const sportProgress = avgProgress(data.sport);
  const sportScore = Math.round(sportProgress.value * 0.3);
  score += sportScore;
  factors.push({label:"运动进度", value:sportScore, max:30, icon:"activity"});
  // Health checkin (20pts)
  const healthItems = data.health||[];
  const t = today();
  const healthDone = healthItems.filter(x=>x.log&&x.log[t]).length;
  const healthScore = healthItems.length ? Math.round(healthDone/healthItems.length*20) : 0;
  score += healthScore;
  factors.push({label:"习惯打卡", value:healthScore, max:20, icon:"leaf"});
  score = Math.min(100, Math.max(0, score));
  const level = score>=80?"高能日":score>=60?"状态不错":score>=40?"一般般":score>=20?"低能量":"需要休息";
  const color = score>=80?"var(--module-1)":score>=60?"var(--module-3)":score>=40?"var(--accent)":score>=20?"var(--module-5)":"var(--danger)";
  return { score, level, color, factors };
}
function renderEnergyCard(){
  const e = calcEnergyScore();
  const r=25, c=2*Math.PI*r, off=c*(1-e.score/100);
  const factorRows = e.factors.map(f=>`<div class="ef-row"><span class="ef-ic" style="color:${e.color}">${icon(f.icon,13)}</span><span class="ef-lb">${esc(f.label)}</span><div class="ef-bar"><i style="width:${f.max>0?Math.round(f.value/f.max*100):0}%;background:${e.color}"></i></div><span class="ef-val">${f.value}/${f.max}</span></div>`).join("");
  const suggest = e.score>=80?"今日适合挑战高难度任务和学习新知识！":e.score>=60?"保持节奏，完成今日核心任务。":e.score>=40?"降低预期，专注最重要的1-2件事。":"允许自己休息，做最轻松的打卡就好。";
  return `<div class="energy-card">
    <div class="ec-head"><div class="ec-dial">${ringSVG(e.score,e.color)}<span class="ec-mid" style="color:${e.color}">${icon("bolt",22)}</span></div>
      <div class="ec-info"><div class="ec-score" style="color:${e.color}">${e.score}<small>/100</small></div><div class="ec-level">${e.level}</div></div></div>

}

/* ---------- BODY TREND CHART ---------- */
function renderBodyChart(){
  const records = (data.body||[]).filter(x=>x.weight||x.waist||x.hip).slice(-10).reverse();
  if(records.length < 2) return "";
  const w=300, h=140, padX=30, padTop=16, padBot=24;
  const innerW=w-2*padX, innerH=h-padTop-padBot;
  const metrics = [
    { key:"weight", label:"体重", color:"var(--module-1)", unit:"kg" },
    { key:"waist", label:"腰围", color:"var(--module-3)", unit:"cm" },
    { key:"hip", label:"臀围", color:"var(--module-5)", unit:"cm" },
  ];
  let lines = "";
  metrics.forEach(m=>{
    const pts = records.map((r,i)=>{
      const v = +r[m.key]; if(!v) return null;
      return { x: padX + innerW*i/(records.length-1), v };
    }).filter(p=>p);
    if(pts.length < 2) return;
    const vals = pts.map(p=>p.v);
    const min = Math.min(...vals), max = Math.max(...vals);
    const rng = (max-min)||1;
    const path = pts.map((p,i)=>{
      const y = padTop + innerH*(1-(p.v-min)/rng);
      return `${i===0?'M':'L'}${p.x},${y}`;
    }).join(" ");
    const dots = pts.map(p=>{
      const y = padTop + innerH*(1-(p.v-min)/rng);
      return `<circle cx="${p.x}" cy="${y}" r="3" fill="${m.color}"/>`;
    }).join("");
    lines += `<path d="${path}" fill="none" stroke="${m.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}`;
  });
  const xLabels = records.map((r,i)=>`<text x="${padX+innerW*i/(records.length-1)}" y="${h-6}" text-anchor="middle" font-size="9" fill="var(--text-tertiary)">${(r.date||"").slice(5)}</text>`).join("");
  const legend = metrics.map(m=>`<span style="display:inline-flex;align-items:center;gap:3px;margin-right:10px;font-size:10px;color:var(--text-tertiary)"><span style="width:8px;height:8px;border-radius:50%;background:${m.color};display:inline-block"></span>${m.label}</span>`).join("");
  return `<div class="body-chart"><div class="bc-title">${icon("scale",14)} 体围趋势（最近${records.length}次）</div>
    <svg viewBox="0 0 ${w} ${h}">${lines}${xLabels}</svg>
    <div style="margin-top:6px">${legend}</div></div>`;
}

function getTimelineTasks(){
  const t = today();
  const pp = calcPeriodPhase();
  const phaseName = pp ? pp.phase.name : "卵泡期";
  const sports = CONFIG.dailyTemplates.sportByPhase[phaseName] || CONFIG.dailyTemplates.sportByPhase["卵泡期"];
  const dow = (new Date().getDay()+6)%7;
  const eng = CONFIG.dailyTemplates.englishByDay[dow];
  const dia = CONFIG.dailyTemplates.dialectByDay[dow];

  // 检查各任务是否已完成
  const isDone = (mkey, title) => {
    const items = data[mkey] || [];
    return items.some(x => x.done && (x.title||"").includes(title.slice(0,4)));
  };
  const isCheckinDone = (mkey) => {
    const items = data[mkey] || [];
    return items.some(x => x.log && x.log[t]);
  };

  return TIMELINE_SLOTS.map(slot => {
    let done = false, title = slot.label, link = "", mkey = "";
    if(slot.source === "english"){
      const engObj = typeof eng === 'object' ? eng : { text: eng };
      title = engObj.text; link = engObj.link; mkey = "english";
      done = isDone("english", title);
    } else if(slot.source === "dialect"){
      const diaObj = typeof dia === 'object' ? dia : { text: dia || "" };
      title = diaObj.text; link = diaObj.link; mkey = "dialect";
      done = isDone("dialect", title);
    } else if(slot.source === "sport"){
      title = sports[0] || slot.label;
      done = (data.sport||[]).some(x => (x.current||0) >= (x.target||1) && x.title.includes("易筋经"));
    } else if(slot.source === "face"){
      done = (data.face||[]).some(x => x.log && x.log[t]);
    } else if(slot.source === "music"){
      done = (data.music||[]).some(x => (x.current||0) >= (x.target||1));
    } else if(slot.source === "custom"){
      // 腰颈护理操 — 检查运动模块
      done = (data.sport||[]).some(x => x.title.includes("腰颈") && (x.current||0) >= (x.target||1));
    }
    return { ...slot, title, link, done, mkey };
  });
}

function renderTimeline(){

  $$(".js-bi-skip").forEach(btn => {

function trendSVG(series){
  const w=320, h=120, padX=10, padTop=14, padBot=18;
  const max=Math.max(...series), min=Math.min(...series);
  const rng=(max-min)||1;
  const innerW=w-2*padX, innerH=h-padTop-padBot;
  const pts=series.map((v,i)=>{
    const x=padX+innerW*i/(series.length-1);
    const y=padTop+innerH*(1-(v-min)/rng);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${padX+innerW} ${h-padBot} L ${padX} ${h-padBot} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#fff" stroke="var(--module-2)" stroke-width="2"/>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-2)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="var(--module-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

/* ---------- donut chart (支出占比) ---------- */
function donutSVG(segs){
  const total=segs.reduce((s,x)=>s+x.amount,0)||1;
  const r=42, c=2*Math.PI*r; let acc=0; const out=[];
  segs.forEach(s=>{
    const len=(s.amount/total)*c;
    out.push(`<circle cx="52" cy="52" r="${r}" fill="none" stroke="${s.color}" stroke-width="14"
      stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(c-acc).toFixed(2)}" transform="rotate(-90 52 52)"/>`);
    acc+=len;
  });
  return `<svg viewBox="0 0 104 104" width="104" height="104">${out.join("")}</svg>`;
}

/* ---------- calendar grid (打卡月视图) ---------- */
let calMonth=null, calItemId=null;
function renderCalendar(m, it){
  if(!it.length) return "";
  const now=new Date();
  const cm=calMonth||{y:now.getFullYear(),m:now.getMonth()};
  const item=it.find(x=>x.id===calItemId)||it[0]; calItemId=item.id;
  const y=cm.y, mo=cm.m;
  const startDow=new Date(y,mo,1).getDay();
  const days=new Date(y,mo+1,0).getDate();
  const todayIso=isoToday();
  const log=item.log||{};
  const chips=it.map(x=>`<button type="button" class="cal-chip ${x.id===item.id?'on':''}" data-calitem="${x.id}">${esc(x.title)}</button>`).join("");
  let cells="", monthCount=0;
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell blank"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const on=!!log[ds]; if(on) monthCount++;
    cells+=`<button type="button" class="cal-cell ${on?'on':''} ${ds===todayIso?'today':''}" data-date="${ds}"${on?` style="background:${m.color};border-color:${m.color}"`:''}>${d}</button>`;
  }
  return `<div class="panel cal-panel">
    <div class="cal-hd"><button class="cal-nav" data-cal="prev" aria-label="上月">${icon("chevron",16,2)}</button>
      <span class="cal-title">${y}年${mo+1}月</span>
      <button class="cal-nav" data-cal="next" aria-label="下月">${icon("chevron",16,2)}</button></div>
    <div class="cal-chips">${chips}</div>
    <div class="cal-dow">${"日一二三四五六".split("").map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-foot">${icon("flame",13)} 连续 ${streak(log)} 天 · 本月 ${monthCount}/${days} 天</div></div>`;
}
function wireCalendar(key, it){
  const block=$("#screen").querySelector(".cal-panel"); if(!block) return;
  block.querySelectorAll("[data-cal]").forEach(el=>el.onclick=()=>{
    const now=new Date(); let y=calMonth?calMonth.y:now.getFullYear(), mo=calMonth?calMonth.m:now.getMonth();
    if(el.dataset.cal==="prev"){ mo--; if(mo<0){mo=11;y--;} }
    else { mo++; if(mo>11){mo=0;y++;} }
    calMonth={y,m:mo}; render();
  });
  block.querySelectorAll("[data-calitem]").forEach(el=>el.onclick=()=>{ calItemId=+el.dataset.calitem; render(); });
  block.querySelectorAll(".cal-cell[data-date]").forEach(el=>el.onclick=()=>{
    const item=it.find(x=>x.id===calItemId)||it[0]; if(!item) return;
    const ds=el.dataset.date; item.log=item.log||{};
    const wasOn=!!item.log[ds];
    const todayIso=isoToday();
    // 今天之前的日期取消打卡：高风险（会断连续），先确认
    if(wasOn && ds<todayIso){
      confirmCalUncheck(item, ds);
      return;
    }
    if(wasOn) delete item.log[ds]; else item.log[ds]=true;
    persist();
    if(wasOn) showCalUndo(item, ds);
  });
}
let calToastTimer=null;
function showCalUndo(item, ds){
  let t=$("#calToast");
  if(!t){ t=document.createElement("div"); t.id="calToast"; t.className="cal-toast"; document.body.appendChild(t); }
  t.innerHTML=`已取消 ${ds.slice(5)} 打卡<button type="button" id="calUndo">撤销</button>`;
  t.classList.add("show");
  const undo=$("#calUndo"); if(undo) undo.onclick=()=>{ item.log=item.log||{}; item.log[ds]=true; persist(); hideCalToast(); };
  clearTimeout(calToastTimer);
  calToastTimer=setTimeout(hideCalToast, 4000);
}
function hideCalToast(){ const t=$("#calToast"); if(t) t.classList.remove("show"); }
function confirmCalUncheck(item, ds){
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>取消打卡</h2>
    <div class="sub">取消 ${ds} 的打卡可能会中断连续天数，确定吗？</div>
    <div class="modal-actions"><button class="btn ghost" id="cu-cancel">保留</button><button class="btn danger" id="cu-ok">取消打卡</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#cu-cancel").onclick=close;
  overlay.querySelector("#cu-ok").onclick=()=>{ delete item.log[ds]; persist(); close(); showCalUndo(item, ds); };
}

  const noteLinkUrl = linkField ? x[linkField.key] : x.link;
  const noteLink = noteLinkUrl ? `<a class="rec-link" href="${attr(noteLinkUrl)}" target="_blank" rel="noopener">${icon("link",11)} 打开链接</a>` : "";
  // V6.0 pro 模块：阅读状态指示器 + 标签展示

  if(m.key==="pro"){

    proTags = (x.tags&&x.tags.length) ? `<div class="rec-tags">${x.tags.map(t=>`<span class="rtag">${esc(t)}</span>`).join("")}</div>` : "";
  }
  return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
    <div class="rname">${esc(x.title||'无标题')}</div>

    ${x.content?`<div class="rnote">${esc(x.content)}</div>`:''}${proTags}${customBlock}${noteLink}</div></div></div>`;
}

function streak(log){
  if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10); if(log[key]){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

  const d = item || newItem(m);
  let fields="";
  if(m.type==="todo"){
    fields=`<div class="field"><label>任务</label><input id="f-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>

      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明">${esc(d.note||'')}</textarea></div>
      <div class="field"><label>学习链接（可选）</label><input id="f-link" value="${attr(d.link||'')}" placeholder="https://..."/></div>`;

      <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" value="${d.amount??''}" placeholder="0"/></div></div>
      <div class="field"><label>分类</label><div class="seg" style="flex-wrap:wrap" id="f-cat">${(m.categories||[]).map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;

      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" style="flex-wrap:wrap" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto">${md}</div>`).join("")}</div></div>`:''}

      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;

    else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;

  });
  // shared image URL field (all types)
  fields+=`<div class="field"><label>图片 URL（可选）</label><input id="f-image" value="${attr(d.image||'')}" placeholder="https://..."/></div>`;

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div>
    <h2>${editing?'编辑':'新建'} · ${m.name}</h2><div class="sub">${m.desc}</div>
    ${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  // segmented pickers
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  // V6.0 pro 阅读状态选择器
  overlay.querySelectorAll(".rs-legend").forEach(leg=>leg.querySelectorAll(".rs-opt").forEach(o=>o.onclick=()=>{
    leg.querySelectorAll(".rs-opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key, d.id); };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    d.layout=seg("#f-layout")||'default';
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim(); d.link=(val("#f-link")||"").trim(); }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.date=val("#f-date"); }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    // V6.0 pro 模块：保存标签 / 阅读状态 / 目标关联
    if(m.key==="pro"){
      const tagsRaw=(val("#f-tags")||"").split(/[,，]/).map(t=>t.trim()).filter(Boolean);
      d.tags = tagsRaw;
      const rsEl=overlay.querySelector("#f-rs .rs-opt.on");
      d.readStatus = rsEl ? rsEl.dataset.v : (d.readStatus||"unread");
      d.goalTag = seg("#f-goal") || "";
    }
    // save custom fields
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    // save image
    d.image=(val("#f-image")||"").trim();
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
  };
}

function newItem(m){
  const base={ id: Date.now() };
  let item;
  if(m.type==="todo") item={...base, title:"", priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"), done:false, note:"", link:""};
  else if(m.type==="checkin") item={...base, title:"", log:{}};
  else if(m.type==="progress") item={...base, title:"", current:0, target: (m.unit==="页"?100:20), unit:m.unit||"", note:""};
  else if(m.type==="finance") item={...base, title:"", type:"expense", amount:"", category:(m.categories&&m.categories[0])||"其他", date:isoToday()};
  else item={...base, title:"", content:"", mood:(m.moods&&m.moods[0])||"", date:isoToday()};
  // V6.0 pro 模块默认字段
  if(m.key==="pro"){ item.tags=[]; item.readStatus="unread"; item.goalTag=""; }
  // initialize custom fields
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

/* ---------- delete confirm ---------- */
function confirmDelete(key,id){
  const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>删除记录</h2>
    <div class="sub">确定删除「${esc(item.title||'这条记录')}」？记录将移入回收站，30天内可恢复。</div>
    <div class="modal-actions"><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{
    // 软删除：移入回收站
    if(!data.__recycle) data.__recycle = [];
    data.__recycle.push({ ...item, _mkey: key, _deletedAt: new Date().toISOString() });
    data[key]=data[key].filter(i=>i.id!=id);
    persist(); close();
    showToast("已移入回收站");
  };
}

/* ---------- V6.0 回收站 ---------- */
function renderRecycleBin(){
  const bin = data.__recycle || [];
  // 清理超过30天的记录
  const now = Date.now();
  const valid = bin.filter(r => {
    const days = (now - new Date(r._deletedAt).getTime()) / 86400000;
    return days <= 30;
  });
  if(valid.length !== bin.length){ data.__recycle = valid; store.save(); }

  if(!valid.length) return `<div class="empty"><span class="e">${icon("trash",26)}</span><div>回收站为空</div></div>`;

  const items = valid.map((r,idx) => {
    const m = modOf(r._mkey);
    const daysLeft = Math.ceil(30 - (now - new Date(r._deletedAt).getTime()) / 86400000);
    return `<div class="rec">
      <div class="top"><div class="body">
        <div class="rname">${esc(r.title||'无标题')}</div>
        <div class="rmeta"><span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${m?m.name:r._mkey}</span>
        <span style="color:var(--text-tertiary);font-size:11px">${daysLeft}天后自动删除</span></div>
      </div></div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn ghost" style="font-size:11px;padding:4px 10px" data-restore="${idx}">恢复</button>
        <button class="btn danger" style="font-size:11px;padding:4px 10px" data-purge="${idx}">永久删除</button>
      </div>
    </div>`;
  }).join("");

  return `<div class="sec-title">回收站（${valid.length}条 · 30天后自动清理）</div>${items}`;
}

function wireRecycleBin(){
  $$("[data-restore]").forEach(btn => {
    btn.onclick = () => {
      const idx = +btn.dataset.restore;
      const bin = data.__recycle || [];
      const item = bin[idx];
      if(!item) return;
      const mkey = item._mkey;
      delete item._mkey; delete item._deletedAt;
      if(!data[mkey]) data[mkey] = [];
      data[mkey].push(item);
      bin.splice(idx, 1);
      persist();
      renderInsight();
      showToast("已恢复");
    };
  });
  $$("[data-purge]").forEach(btn => {
    btn.onclick = () => {
      const idx = +btn.dataset.purge;
      if(!confirm("永久删除不可恢复，确定？")) return;
      data.__recycle.splice(idx, 1);
      persist();
      renderInsight();
    };
  });
}

function openGlobalSearch(){
  const overlay = document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML = `<div class="modal" style="max-height:80vh;overflow-y:auto"><div class="grab"></div>
    <h2>全局搜索</h2>
    <div class="field"><input id="searchInput" placeholder="搜索任务/记录/笔记..." style="font-size:15px" autofocus/></div>
    <div id="searchResults" style="margin-top:12px"></div>
    <div class="modal-actions"><button class="btn ghost" id="s-cancel">关闭</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#s-cancel").onclick=close;

  const input = overlay.querySelector("#searchInput");
  const results = overlay.querySelector("#searchResults");
  input.oninput = () => {
    const q = input.value.trim().toLowerCase();
    if(!q){ results.innerHTML = ""; return; }
    const matches = [];
    CONFIG.modules.forEach(m => {
      (data[m.key]||[]).forEach(x => {
        const title = (x.title||"").toLowerCase();
        const content = (x.content||"").toLowerCase();
        const note = (x.note||"").toLowerCase();
        if(title.includes(q) || content.includes(q) || note.includes(q)){
          matches.push({ m, x });
        }
      });
    });
    if(!matches.length){ results.innerHTML = `<div style="text-align:center;color:var(--text-tertiary);padding:20px">未找到匹配记录</div>`; return; }
    // 按模块分组
    const grouped = {};
    matches.forEach(({m,x}) => { (grouped[m.key] = grouped[m.key] || []).push({m,x}); });
    results.innerHTML = Object.entries(grouped).map(([k,items]) => {
      const m = items[0].m;
      return `<div class="search-group">
        <div class="sg-head">${icon(m.icon,13)} ${m.name} (${items.length})</div>
        ${items.slice(0,5).map(({x})=>`<div class="sg-item" data-go="${k}" data-id="${x.id}">
          <div class="sg-title">${esc(x.title||'无标题')}</div>
          <div class="sg-sub">${esc((x.content||x.note||'').slice(0,60))}</div>
        </div>`).join("")}
      </div>`;
    }).join("");
    // 点击搜索结果跳转
    results.querySelectorAll("[data-go]").forEach(el => {
      el.onclick = () => { close(); go(el.dataset.go); };
    });
  };
  input.focus();
}

/* ---------- 2. 经期日历视图 ---------- */
function calcPhaseForDate(dateStr){
  const pd = getPeriodData();
  if(!pd.lastStart) return null;
  const cycle = getAvgCycle();
  const last = new Date(pd.lastStart);
  const d = new Date(dateStr);
  const diffDays = Math.floor((d - last) / 86400000) + 1;
  if(diffDays < 1) return null;
  const cycleDay = ((diffDays - 1) % cycle) + 1;
  const phase = CONFIG.period.phases.find(p => cycleDay >= p.start && cycleDay <= p.end) || CONFIG.period.phases[0];
  return { cycleDay, phase };
}
function renderPeriodCalendar(){
  const pd = getPeriodData();
  const now = new Date();
  const y = now.getFullYear(), mo = now.getMonth();
  const days = new Date(y, mo+1, 0).getDate();
  const startDow = new Date(y, mo, 1).getDay();
  const todayIso = isoToday();
  const phases = CONFIG.period.phases;
  const phaseClass = { "经期":"p-menstrual", "卵泡期":"p-follicular", "排卵期":"p-ovulation", "黄体期":"p-luteal" };
  const phaseColor = { "经期":"var(--danger)", "卵泡期":"var(--module-1)", "排卵期":"var(--module-3)", "黄体期":"var(--module-5)" };
  let cells = "";
  for(let i=0;i<startDow;i++) cells+=`<div class="pcal-day blank"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const pf = calcPhaseForDate(ds);
    const cls = pf ? phaseClass[pf.phase.name] : "";
    cells+=`<div class="pcal-day ${cls} ${ds===todayIso?'today':''}">${d}</div>`;
  }
  const legend = phases.map(p=>`<span><i style="background:${phaseColor[p.name]}"></i>${p.name}</span>`).join("");
  const hasData = pd.lastStart ? "根据经期记录推算各阶段颜色" : "暂无经期记录，在首页标记经期开始后自动显示阶段";
  return `<div class="period-cal">
    <div class="pc-head">${icon("calendar",15)} 经期日历 · ${y}年${mo+1}月</div>
    <div class="pc-sub">${hasData}</div>
    <div class="pcal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div class="pcal-grid">${cells}</div>

  </div>`;
}

const LEARN_MILESTONES = [10, 30, 60, 100, 200, 500];
const REVIEW_INTERVALS = [1, 3, 7, 15, 30];
let learnTimers = {}; // { taskId: { iv, start, acc, key } }

function isLearnModule(m){ return !!(m && (m.key==="english" || m.key==="dialect")); }

function fmtTimer(ms){
  const s = Math.floor(ms/1000);
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(dateStr, n){
  const p = dateStr.split('-');
  const d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate()+n);
  return ymd(d);
}
function weekRange(){
  const t = today(); const p = t.split('-');
  const d = new Date(+p[0], +p[1]-1, +p[2]);
  const day = d.getDay()||7;
  const mon = new Date(d); mon.setDate(d.getDate()-day+1);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return { start: ymd(mon), end: ymd(sun) };
}
function monthRange(){
  const t = today(); const p = t.split('-');
  const d = new Date(+p[0], +p[1]-1, +p[2]);
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0);
  return { start: ymd(first), end: ymd(last) };
}

/* ---- Feature 1: 学习进度可视化 ---- */
function renderLearnProgress(m){
  const it = data[m.key]||[];
  const total = it.length;
  const done = it.filter(x=>x.done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  const log = (data.__learnLog && data.__learnLog[m.key]) || {};
  const wr = weekRange();
  let weekDays = 0;
  Object.keys(log).forEach(d=>{ if(d>=wr.start && d<=wr.end && log[d]) weekDays++; });
  let prevM = 0, nextM = LEARN_MILESTONES[LEARN_MILESTONES.length-1], milePct = 100;
  for(const ms of LEARN_MILESTONES){ if(done < ms){ nextM = ms; break; } prevM = ms; }
  if(done >= LEARN_MILESTONES[LEARN_MILESTONES.length-1]){ prevM = nextM = LEARN_MILESTONES[LEARN_MILESTONES.length-1]; milePct = 100; }
  else { milePct = nextM>prevM ? Math.round((done-prevM)/(nextM-prevM)*100) : 0; }
  const mileLabel = done >= LEARN_MILESTONES[LEARN_MILESTONES.length-1]
    ? `已达成最高里程碑 ${nextM} 项`
    : `下一里程碑 ${nextM} 项（已完成 ${done}）`;
  return `<div class="learn-panel">
    <div class="lp-head">${icon("trending",16)} 学习进度</div>
    <div class="lp-grid">
      <div class="lp-cell"><div class="lp-val">${total}</div><div class="lp-lab">总任务</div></div>
      <div class="lp-cell"><div class="lp-val" style="color:${m.color}">${done}</div><div class="lp-lab">已完成</div></div>
      <div class="lp-cell"><div class="lp-val" style="color:${m.color}">${pct}%</div><div class="lp-lab">完成率</div></div>
      <div class="lp-cell"><div class="lp-val">${weekDays}</div><div class="lp-lab">本周天数</div></div>
    </div>
    <div class="lp-bar-label">${mileLabel}</div>
    <div class="lp-bar"><i style="width:${milePct}%;background:${m.color}"></i></div>
  </div>`;
}

function doReview(key, taskId){
  const t = today();
  data.__reviewLog = data.__reviewLog || {};
  const r = data.__reviewLog[taskId] || { lastReview: t, reviewCount: 0, nextReview: t };
  const newCount = (r.reviewCount||0) + 1;
  const interval = REVIEW_INTERVALS[Math.min(newCount-1, REVIEW_INTERVALS.length-1)];
  data.__reviewLog[taskId] = { lastReview: t, reviewCount: newCount, nextReview: addDays(t, interval) };
  persist();
  showToast(`复习已记录！下次复习：${data.__reviewLog[taskId].nextReview}`);
}

/* ---- Feature 3: 学习时长统计 ---- */
function renderLearnStats(m){
  const lt = data.__learnTime || {};
  const t = today();
  const wr = weekRange(); const mr = monthRange();
  const todayMin = (lt[t] && lt[t][m.key]) || 0;
  let weekMin = 0, monthMin = 0;
  Object.keys(lt).forEach(d=>{
    const v = (lt[d] && lt[d][m.key]) || 0;
    if(v>0){
      if(d>=mr.start && d<=mr.end) monthMin += v;
      if(d>=wr.start && d<=wr.end) weekMin += v;
    }
  });
  const fmt = x => x>=60 ? `${Math.floor(x/60)}h${x%60>0?`${x%60}m`:''}` : `${x}m`;
  return `<div class="learn-stats">
    <div class="ls-head">${icon("clock",15)} 学习时长</div>
    <div class="ls-grid">
      <div class="ls-cell"><div class="ls-val">${fmt(todayMin)}</div><div class="ls-lab">今日</div></div>
      <div class="ls-cell"><div class="ls-val">${fmt(weekMin)}</div><div class="ls-lab">本周</div></div>
      <div class="ls-cell"><div class="ls-val">${fmt(monthMin)}</div><div class="ls-lab">本月</div></div>
    </div>
  </div>`;
}
function recordLearnTime(key, task){
  const tt = learnTimers[task.id];
  let minutes = 0;
  if(tt){
    const elapsed = tt.acc + (Date.now() - tt.start);
    clearInterval(tt.iv);
    minutes = Math.max(1, Math.round(elapsed/60000));
    delete learnTimers[task.id];
  } else if(task.__timerAcc){
    minutes = Math.max(1, Math.round(task.__timerAcc/60000));
  }
  if(minutes > 0){
    const t = today();
    data.__learnTime = data.__learnTime || {};
    data.__learnTime[t] = data.__learnTime[t] || {};
    data.__learnTime[t][key] = (data.__learnTime[t][key]||0) + minutes;
    delete task.__timerAcc;
  }
}
function logLearnDay(key){
  const t = today();
  data.__learnLog = data.__learnLog || {};
  data.__learnLog[key] = data.__learnLog[key] || {};
  data.__learnLog[key][t] = true;
}
function initReview(task){
  const t = today();
  data.__reviewLog = data.__reviewLog || {};
  if(!data.__reviewLog[task.id]){
    data.__reviewLog[task.id] = { lastReview: t, reviewCount: 0, nextReview: addDays(t, REVIEW_INTERVALS[0]) };
  }
}
function clearAllLearnTimers(){
  Object.keys(learnTimers).forEach(id=>{
    const tt = learnTimers[id];
    if(tt){
      const elapsed = tt.acc + (Date.now() - tt.start);
      const x = (data[tt.key]||[]).find(i=>i.id==id);
      if(x) x.__timerAcc = elapsed;
      clearInterval(tt.iv);
      delete learnTimers[id];
    }
  });
}
function wireLearnTimer(key){
  const m = modOf(key);
  if(!isLearnModule(m) || m.type!=="todo") return;
  clearAllLearnTimers();
  $("#screen").querySelectorAll(".timer-btn").forEach(btn=>{
    const id = btn.dataset.id;
    const x = data[key].find(i=>i.id==id);
    if(x && x.__timerAcc > 0 && !x.done) btn.textContent = "继续计时";
    btn.onclick = e=>{
      e.stopPropagation();
      const id = btn.dataset.id;
      const x = data[key].find(i=>i.id==id);
      if(!x) return;
      if(learnTimers[id]){
        const tt = learnTimers[id];
        x.__timerAcc = tt.acc + (Date.now() - tt.start);
        clearInterval(tt.iv);
        delete learnTimers[id];
        btn.classList.remove("running");
        btn.textContent = "继续计时";
        store.save();
      } else {
        const acc = x.__timerAcc || 0;
        learnTimers[id] = { iv: null, start: Date.now(), acc: acc, key: key };
        btn.classList.add("running");
        learnTimers[id].iv = setInterval(()=>{
          if(!learnTimers[id]) return;
          const tt2 = learnTimers[id];
          const elapsed = tt2.acc + (Date.now() - tt2.start);
          btn.textContent = fmtTimer(elapsed);
          x.__timerAcc = elapsed;
        }, 1000);
        btn.textContent = fmtTimer(acc);
      }
    };
  });
}

/* ---------- 3. 月度对比 ---------- */
function renderMonthCompare(){
  const recs = data.finance || [];
  const now = new Date();
  const curY = now.getFullYear(), curM = now.getMonth();
  const prevD = new Date(curY, curM-1, 1);
  const prevY = prevD.getFullYear(), prevM = prevD.getMonth();
  const ymCur = `${curY}-${String(curM+1).padStart(2,'0')}`;
  const ymPrev = `${prevY}-${String(prevM+1).padStart(2,'0')}`;

  function sum(ym){
    let inc=0, exp=0;
    recs.forEach(x=>{
      if((x.date||"").startsWith(ym)){
        if(x.type==="income") inc += +x.amount||0;
        else if(x.type==="expense") exp += +x.amount||0;
      }
    });
    return { inc, exp, bal: inc-exp };
  }
  const cur = sum(ymCur), prev = sum(ymPrev);

  function trendCell(label, curVal, prevVal, goodWhenUp){
    let delta = "";
    if(prevVal!==0 && curVal!==prevVal){
      const pct = Math.round(Math.abs((curVal-prevVal)/Math.abs(prevVal)*100));
      const up = curVal > prevVal;
      const good = goodWhenUp ? up : !up;
      const color = good ? "var(--module-1)" : "var(--danger)";
      const arr = up ? "↑" : "↓";
      delta = `<span class="mc-delta" style="color:${color}">${arr}${pct}%</span>`;
    } else if(prevVal===0 && curVal>0){
      delta = `<span class="mc-delta" style="color:var(--module-1)">新增</span>`;
    } else if(curVal===prevVal){
      delta = `<span class="mc-delta" style="color:var(--text-tertiary)">持平</span>`;
    }
    return `<div class="mc-cell">
      <div class="mc-lab">${label}</div>
      <div class="mc-cur">¥${curVal}</div>
      <div class="mc-prev">上月 ¥${prevVal} ${delta}</div>
    </div>`;
  }

  return `<div class="sec-title">${icon("trending",14)} 月度对比</div>
    <div class="compare-panel">
      <div class="mc-month">${curM+1}月 vs ${prevM+1}月</div>
      <div class="mc-grid">
        ${trendCell("收入", cur.inc, prev.inc, true)}
        ${trendCell("支出", cur.exp, prev.exp, false)}
        ${trendCell("结余", cur.bal, prev.bal, true)}
      </div>
    </div>`;
}

/* ---- 3. 每日学习测试 ---- */
function extractKeyword(text){
  if(!text) return "";
  const tokens = String(text).split(/[，。、；：！？\.""''（）()\[\]{},;:!?\/\\·⭐\-*\n\r\s]+/).filter(t=>t.length>=2 && t.length<=8);
  const stop = new Set(["关键","包括","通过","进行","可以","一个","这个","那种","如下","目前","今天","昨日","以下","属于","适用","支持","以及","用于","形成","适用"]);
  const filtered = tokens.filter(t=>!stop.has(t) && !/^\d+$/.test(t) && !/^[a-zA-Z]{1,2}$/.test(t));
  return filtered[0] || tokens[0] || String(text).slice(0,4);
}
function genQuizQuestions(concepts, n){
  if(!concepts || concepts.length < 2) return [];
  const seed = parseInt(isoToday().replace(/-/g,""),10) || 1;
  let s = seed;
  const rnd = ()=>{ s = (s*9301+49297)%233280; return s/233280; };
  const pick = arr => { for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; };
  const pool = pick(concepts.slice());
  const qs = [];
  for(let i=0;i<pool.length && qs.length<n;i++){
    const target = pool[i];
    const kw = extractKeyword(target.content);
    if(!kw) continue;
    const others = concepts.filter(c=>c!==target);
    const distractors = [];
    const dpool = pick(others.slice());
    for(let j=0;j<dpool.length && distractors.length<3;j++){
      const dk = extractKeyword(dpool[j].content);
      if(dk && dk!==kw && !distractors.includes(dk)) distractors.push(dk);
    }
    if(distractors.length < 3) continue;
    const options = pick([kw, ...distractors]);
    qs.push({
      question: `笔记「${target.title||'无标题'}」中包含以下哪个关键词？`,
      options, answer: kw,
    });
  }
  return qs;
}
function renderDailyQuiz(){
  const todayKey = isoToday();
  const concepts = (data.pro||[]).filter(x=>x.mood==="概念" && x.content);
  if(concepts.length < 2){
    return `<div class="quiz-panel">
      <div class="qp-head">${icon("activity",16)} 每日学习测试 <span class="qp-date">${todayKey}</span></div>
      <div class="qp-empty">记录至少 2 条「概念」笔记后，将自动生成每日 3 道选择题，巩固记忆。</div>
    </div>`;
  }
  const questions = genQuizQuestions(concepts, 3);
  if(!questions.length){
    return `<div class="quiz-panel">
      <div class="qp-head">${icon("activity",16)} 每日学习测试 <span class="qp-date">${todayKey}</span></div>
      <div class="qp-empty">笔记内容较短，暂无法提取足够的测试关键词，请丰富概念笔记内容。</div>
    </div>`;
  }
  const log = data.__quizLog||{};
  const todayLog = log[todayKey];
  let scoreBlock = "";
  if(todayLog){
    scoreBlock = `<div class="qp-score">今日成绩：<b>${todayLog.score}/${todayLog.total}</b> · 正确率 ${Math.round(todayLog.score/todayLog.total*100)}%</div>`;
    const days = Object.keys(log).sort().slice(-7);
    if(days.length>1){
      const trend = days.map(d=>{
        const l=log[d]; const h = l.total? Math.max(4,Math.round(l.score/l.total*40)):4;
        return `<span class="tbar" style="height:${h}px" title="${d}: ${l.score}/${l.total}"></span>`;
      }).join("");
      scoreBlock += `<div class="qp-trend"><span class="tt">近 ${days.length} 次趋势</span>${trend}</div>`;
    }
  }
  const qs = questions.map((q,i)=>{
    if(todayLog){
      const ans = todayLog.answers[i]||{};
      const opts = q.options.map((o,j)=>{
        let cls="";
        if(o===q.answer) cls="correct";
        else if(j===ans.selected && o!==q.answer) cls="wrong";
        return `<button class="quiz-opt ${cls}" disabled>${String.fromCharCode(65+j)}. ${esc(o)}</button>`;
      }).join("");
      const ok = ans.correct;
      return `<div class="quiz-q">
        <div class="qq-title"><span class="qq-no">Q${i+1}</span>${esc(q.question)}</div>
        ${opts}
        <div class="qq-explain">正确答案：<b>${esc(q.answer)}</b>${ok?' · 回答正确':' · 回答错误'}</div>
      </div>`;
    }
    const opts = q.options.map((o,j)=>`<button class="quiz-opt" data-qid="${i}" data-opt="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join("");
    return `<div class="quiz-q" id="qq-${i}">
      <div class="qq-title"><span class="qq-no">Q${i+1}</span>${esc(q.question)}</div>
      ${opts}
    </div>`;
  }).join("");
  return `<div class="quiz-panel">
    <div class="qp-head">${icon("activity",16)} 每日学习测试 <span class="qp-date">${todayKey}</span></div>
    ${scoreBlock}${qs}
  </div>`;
}
function wireQuiz(){
  const panel = $("#screen").querySelector(".quiz-panel");
  if(!panel) return;
  const todayKey = isoToday();
  if((data.__quizLog||{})[todayKey]) return;
  const concepts = (data.pro||[]).filter(x=>x.mood==="概念" && x.content);
  const questions = genQuizQuestions(concepts, 3);
  if(!questions.length) return;
  const answers = new Array(questions.length).fill(null);
  panel.querySelectorAll(".quiz-opt[data-qid]").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const qid = +btn.dataset.qid;
      const optIdx = +btn.dataset.opt;
      const q = questions[qid];
      if(answers[qid]!==null) return;
      const correct = q.options[optIdx] === q.answer;
      answers[qid] = { selected: optIdx, correct };
      const qEl = panel.querySelector("#qq-"+qid);
      qEl.querySelectorAll(".quiz-opt").forEach((o,j)=>{
        o.disabled = true;
        if(q.options[j]===q.answer) o.classList.add("correct");
        else if(j===optIdx) o.classList.add("wrong");
      });
      qEl.insertAdjacentHTML("beforeend", `<div class="qq-explain">正确答案：<b>${esc(q.answer)}</b> · ${correct?'回答正确':'回答错误'}</div>`);
      if(answers.every(a=>a!==null)){
        const score = answers.filter(a=>a&&a.correct).length;
        if(!data.__quizLog) data.__quizLog = {};
        data.__quizLog[todayKey] = { score, total: questions.length, answers };
        store.save();
        showToast(`测试完成！得分 ${score}/${questions.length}`);
        setTimeout(()=>render(), 900);
      }
    };
  });
}
